---
# Keep the README coverage badge in step with main.
#
# Shields has no way to see a project's coverage, so the number is published to
# a gist and the badge reads that gist as an endpoint. The gist ID below is
# public; the token that writes to it is the GIST_SECRET repository secret.
name: Coverage Badge

on:
  push:
    branches:
      - main
    # Coverage can only have moved if the code, the tests or the thresholds
    # moved with it. A README or docs push leaves the gist already correct, so
    # there is nothing to run.
    paths:
      - "src/**"
      - "test/**"
      - "vitest.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/coverage-badge.yml"

defaults:
  run:
    shell: bash

env:
  CI: true

jobs:
  coverage-badge:
    name: Coverage Badge
    runs-on: ubuntu-latest
    steps:
      # The job needs nothing from git after the checkout, and a later step
      # hands a token to a third-party action. Leaving the checkout credentials
      # in .git/config would put them within that action's reach.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # `core.test.ts` walks the built package rather than the source, since
      # what a consumer resolves is `dist/` and the `browser` field is the whole
      # mechanism it is checking. Without this the suite fails before it can
      # report a number, which is what it had been doing here since the job was
      # written. `pr.yml` and `release.yml` both build first for this reason.
      - run: pnpm build
      - run: pnpm test:coverage

      - name: Read coverage
        id: coverage
        run: |
          SUMMARY=test/.coverage/coverage-summary.json

          if [ ! -f "$SUMMARY" ]; then
            echo "No coverage summary at $SUMMARY."
            echo "The json-summary reporter is what writes it; see vitest.config.ts."
            exit 1
          fi

          COVERAGE=$(jq '.total.lines.pct | floor' "$SUMMARY")

          if [ "$COVERAGE" -ge 90 ]; then
            COLOR=brightgreen
          elif [ "$COVERAGE" -ge 80 ]; then
            COLOR=green
          elif [ "$COVERAGE" -ge 70 ]; then
            COLOR=yellow
          else
            COLOR=red
          fi

          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "color=$COLOR" >> "$GITHUB_OUTPUT"

      - name: Update coverage badge
        # Pinned to a commit rather than the tag: this is a third-party action
        # and it is handed GIST_SECRET, so it should not be able to change under
        # us. Bump both the SHA and the comment together.
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: f2d667bbcc14dab9efa679f2113b1e00
          filename: coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.coverage }}%
          color: ${{ steps.coverage.outputs.color }}
