---
# Keep the README coverage badge in step with main.
#
# Shields has no way to see a project's coverage, so the number is published to
# a gist and the badge reads that gist as an endpoint. The gist ID below is
# public; the token that writes to it is the GIST_SECRET repository secret.
name: Coverage Badge

on:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

env:
  CI: true

jobs:
  coverage-badge:
    name: Coverage Badge
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

      - name: Read coverage
        id: coverage
        run: |
          SUMMARY=test/.coverage/coverage-summary.json

          if [ ! -f "$SUMMARY" ]; then
            echo "No coverage summary at $SUMMARY."
            echo "The json-summary reporter is what writes it; see vitest.config.ts."
            exit 1
          fi

          COVERAGE=$(jq '.total.lines.pct | floor' "$SUMMARY")

          if [ "$COVERAGE" -ge 90 ]; then
            COLOR=brightgreen
          elif [ "$COVERAGE" -ge 80 ]; then
            COLOR=green
          elif [ "$COVERAGE" -ge 70 ]; then
            COLOR=yellow
          else
            COLOR=red
          fi

          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "color=$COLOR" >> "$GITHUB_OUTPUT"

      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: f2d667bbcc14dab9efa679f2113b1e00 
          filename: coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.coverage }}%
          color: ${{ steps.coverage.outputs.color }}
