---
name: PR

on:
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

env:
  CI: true

jobs:
  lint:
    name: Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fta

  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The import-graph test walks `dist/`, since what a consumer resolves is
      # the built package rather than the source. Nothing else here needs it.
      - run: pnpm build
      - run: pnpm test:coverage

      # A visual regression failure is about an image, and the numbers in the
      # log only say how far it moved. This is the image itself, to open next to
      # the baseline it did not match. Nothing is uploaded on a green run, or
      # when the job failed for some other reason.
      - name: Upload rendered images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression
          path: test/.visual/
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:check
