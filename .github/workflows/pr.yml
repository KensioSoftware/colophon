---
name: PR

on:
  pull_request:
    branches:
      - main
  # The version job in release.yml opens its pull request with GITHUB_TOKEN,
  # and a pull request opened with that token does not fire `pull_request`:
  # GitHub declines to let a workflow start another workflow. Without this the
  # main ruleset's required Lint and Test would never report on it, and it
  # could never be merged.
  #
  # A ruleset matches a check by name whatever workflow posted it, and these
  # are the same two jobs under the same two names, so running them on the push
  # satisfies the same gate. Scoped to the branch prefix that job uses, so
  # ordinary branches still get one run rather than two.
  push:
    branches:
      - "release/**"

defaults:
  run:
    shell: bash

# A push to a branch that already has a run in flight makes that run pointless:
# only the newest commit is going to be merged. Cancelling it frees the runner
# for the run that matters, which is what a force-push during review mostly
# costs.
#
# The fallback is what keeps that true on the push trigger above, where there
# is no pull request number: without it every release/** push would share one
# group named "pr-" and cancel the run before it.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  # The typecheck used to be a job of its own. It is under a second of work, and
  # a job to itself meant paying a whole runner start and install to get at it,
  # so it sits here behind the same install as the linting.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm fta
      - run: pnpm build:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The import-graph test walks `dist/`, since what a consumer resolves is
      # the built package rather than the source. Nothing else here needs it.
      - run: pnpm build
      - run: pnpm test:coverage

      # A visual regression failure is about an image, and the numbers in the
      # log only say how far it moved. This is the image itself, to open next to
      # the baseline it did not match. Nothing is uploaded on a green run, or
      # when the job failed for some other reason.
      - name: Upload rendered images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression
          path: test/.visual/
          if-no-files-found: ignore
