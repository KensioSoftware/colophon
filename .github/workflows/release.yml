---
# Publishes @kensio/colophon, when someone runs it from the Actions tab. What
# it does is decided by .releaserc.yaml; this file is the plumbing. It replaces
# scripts/publish.sh, which did the same job from a laptop and now covers only
# the major releases this workflow refuses.
#
# Three things live outside the repository and have to exist for it to work:
#
#   1. A trusted publisher on npmjs.com for @kensio/colophon, pointing at this
#      repository, this workflow file, and the "release" environment below,
#      with npm publish as the only allowed action. This is what replaces a
#      stored NPM_TOKEN: there is no npm credential in this repository.
#
#   2. A repository environment named "release". Adding a required reviewer
#      makes a publish wait for a second pair of eyes, which is worth having
#      if anyone else ever gains write access. Starting the run is already a
#      deliberate act, so approving your own run adds little on its own. The
#      choice is only made there, not here.
#
#   3. Settings → Actions → General → "Allow GitHub Actions to create and
#      approve pull requests", for the version job at the bottom. Without it
#      `gh pr create` fails with a permissions error that does not mention the
#      setting. The publish itself is unaffected, since by then it has already
#      happened.
#
# None of them is recorded in the repository, so if publishes start failing
# with an authentication error, check that the trusted publisher still names
# this workflow file: renaming this file silently invalidates it.

name: Release

on:
  # Started by hand, not by merging. Pull requests land here in bursts, many of
  # them from Dependabot, and publishing each one would put a version on the
  # registry that nobody installs any sooner. One run ships everything
  # accumulated since the last tag, as a single version with one set of release
  # notes. It also keeps the rebuild stamp quiet: the package version is part
  # of it, so each version published re-renders every image on every site that
  # upgrades.
  #
  # Running this from a branch other than main is harmless, since
  # .releaserc.yaml releases from main only, so semantic-release finds nothing
  # to do.
  workflow_dispatch:
    inputs:
      minor:
        description: >-
          Release a minor version. Leave unticked for a patch, which is
          what everything releasable defaults to.
        type: boolean
        default: false

defaults:
  run:
    shell: bash

env:
  CI: true

# One release at a time, and never cancelled part-way: a run killed between
# pushing the tag and publishing the tarball leaves a version that exists in
# git and not on the registry, which is awkward to unpick.
concurrency:
  group: release
  cancel-in-progress: false

# Nothing is granted by default; each job below asks for the scopes it needs
# and no more.
permissions: {}

# The checks pr.yml already ran, run again against main, and then publish.
#
# Re-running them is not belt and braces. The main ruleset does not require a
# pull request to be up to date with main before it merges, so two branches
# that were each green on their own can still break main together, and a
# release is the first thing after that which anyone would notice.
#
# They are two jobs rather than one because the test job builds first: the
# import-graph test walks dist/ rather than src/, since what a consumer
# resolves is the built package. That is the same split pr.yml makes, and the
# steps are deliberately the same steps. Keep the two files in step with each
# other.
#
# The names are "Release lint" and "Release test" rather than the bare "Lint"
# and "Test" pr.yml posts. Those two are the required status checks in the main
# ruleset, and a ruleset matches a check by name whatever workflow posted it,
# so a release dispatched from a branch with an open pull request would
# otherwise report into that pull request's gate.
#
# Spelled out rather than calling `pnpm check`, which starts with `pnpm fmt`
# and rewrites files instead of reporting on them.
jobs:
  lint:
    name: Release lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to commit SHAs in the two jobs at the bottom rather
      # than the tags pr.yml uses, because a tag can be moved to point at new
      # code, which is how the tj-actions/changed-files compromise reached the
      # repositories using it. These two check jobs go through the repository's
      # own setup action instead, which pins by tag: they hold no credential,
      # run on a third-party runner already, and hand nothing on to the publish
      # below, which checks out the commit again for itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm fta
      - run: pnpm build:check

  test:
    name: Release test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm test:coverage

      # A visual regression failure is about an image, and the numbers in the
      # log only say how far it moved. This is the image itself, to open next
      # to the baseline it did not match.
      - name: Upload rendered images
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression
          path: test/.visual/
          if-no-files-found: ignore

  release:
    name: Release
    # Nothing runs here until both checks above are green. They check out the
    # same commit this job publishes, so a green check is a statement about the
    # tarball semantic-release is about to build.
    needs: [lint, test]

    # A GitHub-hosted runner rather than the Blacksmith one the checks use.
    # This is the job that mints the npm publish credential, and the publish
    # path is the one place worth keeping third parties out of. The checks hold
    # no credential and produce nothing this job consumes, so they can run
    # wherever is fastest without that reach following them here.
    runs-on: ubuntu-latest

    # What the npm trusted publisher is scoped to, and where any approval
    # requirement lives. See the note at the top of this file.
    environment: release

    permissions:
      # Push the tag and create the GitHub Release.
      contents: write
      # Mint the OIDC token npm exchanges for a short-lived publish
      # credential. Without this, @semantic-release/npm falls back to looking
      # for an NPM_TOKEN and fails.
      id-token: write

    # Empty when the commits since the last tag were only chore/test/docs, and
    # nothing was published. The version job below reads it to decide whether
    # there is anything to write down.
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release works out the next version by reading the
          # existing tags, so a shallow clone would have it start from zero.
          fetch-depth: 0
          # semantic-release authenticates its own push with GITHUB_TOKEN, so
          # leaving checkout's credential in .git/config only widens what a
          # later step could use.
          persist-credentials: false

      # The repository's setup action is skipped here for the pinning reason
      # above, which costs this job the node_modules cache and buys back the
      # SHAs. A publish is a few times a month and the install is under a
      # minute.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Decides the version, builds the release notes out of the commit
      # subjects since the last tag, publishes to npm, tags, and writes the
      # GitHub Release with those notes as its body. Does nothing at all if
      # those commits are only chore/test/docs. See .releaserc.yaml. dist/ is
      # built here by prepack, from this checkout: the checks above prove the
      # build works, they do not hand anything on.
      - id: release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by analyzeCommitsCmd in .releaserc.yaml, which raises the
          # release to a minor when this is "true".
          RELEASE_MINOR: ${{ inputs.minor }}

  # `version` in package.json, caught up to what was just published, and sent
  # to main as a pull request.
  #
  # A pull request rather than a push, because the main ruleset requires the
  # Lint and Test checks on whatever lands there and a commit created inside
  # this run has none. pr.yml runs those two on pushes to `release/**` for
  # exactly this reason.
  #
  # That number is not what the released version *is*: the tag and the registry
  # are that, and both already exist by the time this runs. So a failure here,
  # or a pull request left unmerged, costs a stale package.json and nothing
  # else. It does not cost a broken release, and nothing about the next one
  # depends on it having been merged, since semantic-release reads the tags.
  version:
    name: Write the version back
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      # Pushing the branch.
      contents: write
      # Opening the pull request.
      pull-requests: write
    steps:
      # The one job here that keeps checkout's credential, because it is the
      # one that pushes. It holds no npm credential and publishes nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      # For `npm pkg set` below, and so that the version of npm rewriting
      # package.json is the one everyone else's edits go through.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Commit and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          npm pkg set version="$VERSION"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing changed. Already written back?"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="release/v$VERSION"
          git switch --create "$branch"
          git add package.json
          git commit --message "chore: version $VERSION"
          git push origin "$branch"

          # --body-file rather than --body, so the markdown below is not at the
          # mercy of how this block is indented.
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          [$VERSION](https://github.com/KensioSoftware/colophon/releases/tag/v$VERSION) is published. This is the part of it that belongs on main: \`version\` in package.json caught up to it.

          Nothing depends on this being merged: the tag and the registry are the version of record, and the next release works out its own number from the tags rather than from this file.
          EOF

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: version $VERSION" \
            --body-file "$RUNNER_TEMP/pr-body.md"
